name: Publish to MCP Registry

# Publishing needs an identity the registry trusts. Locally that means an
# interactive device-code login; from Actions, OIDC proves this repo belongs to
# the conduktor org with no secret to store and nothing to rotate.
#
# Runs when server.json changes, so bumping the version there is the whole
# release process.

on:
  push:
    branches: [main]
    paths: ["server.json"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for login github-oidc
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz \
            | tar -xz mcp-publisher
          sudo install -m 0755 mcp-publisher /usr/local/bin/mcp-publisher

      - name: Validate
        run: mcp-publisher validate

      - name: Publish
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
