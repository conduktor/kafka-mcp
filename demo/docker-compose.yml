# A Kafka cluster, Console, and the MCP endpoint — in one command.
#
# Redpanda rather than Kafka + controller: one container, seconds to start, and
# for showing what the tools return the wire protocol is what matters.
#
#   docker compose up -d
#   open http://localhost:8080      admin@conduktor.io / adminP4ss!
#
# Console runs on the Free plan here. MCP is on by default (enable_mcp), so no
# licence is needed to try the tools. A few of them sit behind licensed
# features — see the README.

services:
  redpanda:
    image: redpandadata/redpanda:v25.2.5
    container_name: demo-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:18
    container_name: demo-postgres
    environment:
      POSTGRES_PASSWORD: pwd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  console:
    image: conduktor/conduktor-console:1.47.2
    container_name: demo-console
    ports:
      - "8080:8080"
    volumes:
      - ./console-config.yaml:/opt/conduktor/console-config.yaml
    environment:
      CDK_IN_CONF_FILE: /opt/conduktor/console-config.yaml
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: curl --fail --silent http://localhost:8080/api/health/live --output /dev/null || exit 1
      interval: 5s
      timeout: 5s
      retries: 40

  # Gives the tools something to describe: topics with traffic, a consumer group
  # that reads, and one that falls behind so lag is not zero everywhere.
  seed:
    image: redpandadata/redpanda:v25.2.5
    container_name: demo-seed
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/seed.sh"]
    volumes:
      - ./seed.sh:/seed.sh:ro
    restart: "no"
